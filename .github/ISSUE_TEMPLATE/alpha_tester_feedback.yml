name: Alpha tester feedback
description: Share structured feedback from a closed-alpha testing session.
title: "[Alpha feedback]: "
labels: ["alpha-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for workflow feedback, confusing behavior, or scientific-review notes. Please keep private data out of public issues.
  - type: input
    id: role
    attributes:
      label: Testing role or context
      placeholder: "postgraduate researcher, lab assistant, developer, etc."
  - type: textarea
    id: workflow
    attributes:
      label: Workflow tested
      placeholder: "Open file -> configure settings -> analyze -> export PDF/Excel..."
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked well?
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing or slow?
    validations:
      required: true
  - type: textarea
    id: scientific-risk
    attributes:
      label: Scientific correctness concerns
      description: Mention peaks, baseline, SNR, overlap, reference matches, or exports that looked questionable.
  - type: dropdown
    id: severity
    attributes:
      label: Overall readiness impression
      options:
        - Usable for guided alpha testing
        - Needs fixes before more testing
        - Blocked for my workflow
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include private paths, sample IDs, patient data, or confidential laboratory details.
          required: true

