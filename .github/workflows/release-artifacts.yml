name: Release Artifacts

on:
  workflow_dispatch:

jobs:
  build-desktop-archive:
    name: Build desktop archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: python -m pip install -e ".[package]"

      - name: Build release archive
        run: python tools/build_release_app.py

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chromatsvet-release-${{ runner.os }}-${{ runner.arch }}
          path: release_artifacts/v*/**
