[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromatsvet"
version = "0.3.0"
description = "Desktop spectral and chromatographic data analysis with a Rust/PyO3 core."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ChromaTsvet contributors" }
]
keywords = ["spectroscopy", "chromatography", "signal-processing", "pyqt", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
package = [
    "maturin>=1.5",
    "pyinstaller>=6.0",
]
dev = [
    "maturin>=1.5",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/pinkprincess766/ChromaTsvet"
Repository = "https://github.com/pinkprincess766/ChromaTsvet"
Issues = "https://github.com/pinkprincess766/ChromaTsvet/issues"

[project.scripts]
chromatsvet = "python_analyzer.main:run_app"

[tool.setuptools]
py-modules = ["filters", "paths"]

[tool.setuptools.packages.find]
where = ["."]
include = ["python_analyzer*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "chromatsvet.egg-info",
    "rust_module/target",
    "output",
    "logs",
]
markers = [
    "gui: tests that create Qt widgets",
    "integration: tests that exercise multiple application layers",
    "slow: tests that are intentionally slower than normal unit tests",
]
